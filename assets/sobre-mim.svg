h-2zM28 56h2v2h-2zM32 56h2v2h-2zM28 58h4v2h-4zM28 60h2v2h-2zM32 60h2v2h-2zM28 62h2v2h-2zM34 62h2v2h-2zM28 64h2v2h-2zM36 64h2v2h-2zM42 52h6v2h-6zM40 54h2v2h-2zM48 54h2v2h-2zM40 56h2v2h-2zM48 56h2v2h-2zM40 58h10v2h-10zM40 60h2v2h-2zM48 60h2v2h-2zM40 62h2v2h-2zM48 62h2v2h-2zM40 64h2v2h-2zM48 64h2v2h-2zM52 52h2v2h-2zM60 52h2v2h-2zM52 54h2v2h-2zM60 54h2v2h-2zM52 56h2v2h-2zM60 56h2v2h-2zM52 58h2v2h-2zM60 58h2v2h-2zM52 60h2v2h-2zM60 60h2v2h-2zM52 62h2v2h-2zM60 62h2v2h-2zM54 64h6v2h-6zM66 52h6v2h-6zM64 54h2v2h-2zM72 54h2v2h-2zM64 56h2v2h-2zM72 56h2v2h-2zM64 58h10v2h-10zM64 60h2v2h-2zM72 60h2v2h-2zM64 62h2v2h-2zM72 62h2v2h-2zM64 64h2v2h-2zM72 64h2v2h-2zM66 46h4v2h-4zM72 46h2v2h-2zM64 48h2v2h-2zM68 48h4v2h-4zM80 54h2v2h-2zM80 56h2v2h-2zM80 60h2v2h-2zM80 62h2v2h-2z"/><text x="28.0" y="98" text-anchor="start" fill="#ddd" font-family="Consolas, 'Courier New', monospace" font-size="15">Oi! Eu sou o Kauã, moro em Suzano (SP) e estudo Engenharia da Computação</text><text x="28.0" y="122" text-anchor="start" fill="#ddd" font-family="Consolas, 'Courier New', monospace" font-size="15">na UNICID. Sou estagiário de TI na Mais Capital, onde dou suporte N1/N2 e</text><text x="28.0" y="146" text-anchor="start" fill="#ddd" font-family="Consolas, 'Courier New', monospace" font-size="15">uso <tspan fill="#ff5c7a">Python</tspan> para automatizar rotinas. Criei o AUTOMATSUO, um RPA para ERP</text><text x="28.0" y="170" text-anchor="start" fill="#ddd" font-family="Consolas, 'Courier New', monospace" font-size="15">industrial (Baan / Infor LN) que reduziu cerca de 40% do tempo operacional.</text><text x="28.0" y="194" text-anchor="start" fill="#ddd" font-family="Consolas, 'Courier New', monospace" font-size="15">Hoje meu foco é <tspan fill="#ff5c7a">Python</tspan>, <tspan fill="#ff5c7a">dados</tspan> e <tspan fill="#ff5c7a">inteligência artificial</tspan>.</text><g class="blink"><path fill="#e0193d" d="M762 206h14v3h-3v3h-3v3h-2v-3h-3v-3h-3zM768 215h2v2h-2z"/></g></svg>